name: Atualiza o README

# Regenera o card "GitHub ao vivo" (assets/github-*.svg) com dados novos da API.
on:
  schedule:
    - cron: '17 9 * * *'        # todo dia, 06:17 no horário de Brasília
  workflow_dispatch:             # botão "Run workflow" na aba Actions
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Gera os SVGs
        run: node scripts/build.mjs --live
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Publica se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets scripts/data.json
          git diff --cached --quiet || git commit -m "chore: atualiza o card do GitHub"
          git push
